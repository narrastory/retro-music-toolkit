<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="Retro Music Toolkit">
  <title>Retro Music Toolkit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223a"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ffe6"/>
      <stop offset="1" stop-color="#4fd1a5"/>
    </linearGradient>
    <linearGradient id="bass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0f0"/>
      <stop offset="1" stop-color="#39608f"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="23" fill="none" stroke="#31486b" stroke-width="2"/>

  <!-- Melody: five chunky blocks, one amber peak. -->
  <g fill="url(#mint)">
    <rect x="16" y="50" width="14" height="14" rx="2"/>
    <rect x="36" y="38" width="14" height="14" rx="2"/>
    <rect x="76" y="38" width="14" height="14" rx="2"/>
    <rect x="96" y="50" width="14" height="14" rx="2"/>
  </g>
  <rect x="56" y="26" width="14" height="14" rx="2" fill="#ffca57"/>

  <!-- Bass: three blocks, lower and wider to read at 16px. -->
  <g fill="url(#bass)">
    <rect x="16" y="94" width="18" height="14" rx="2"/>
    <rect x="42" y="86" width="18" height="14" rx="2"/>
    <rect x="94" y="94" width="18" height="14" rx="2"/>
  </g>
  <rect x="68" y="86" width="18" height="14" rx="2" fill="url(#bass)"/>
</svg>
