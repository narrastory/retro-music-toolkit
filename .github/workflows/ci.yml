name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/runtime/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:audio
      - run: npm run test:web
      - name: Schema is in sync
        run: |
          npm run schema -- --force
          git diff --exit-code schema/score.schema.json || {
            echo "schema/score.schema.json is stale; run 'npm run schema -- --force'"
            exit 1
          }
